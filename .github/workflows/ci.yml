name: CI

on:
  push:
    branches: [ main, master, AI優化, 超級大改版 ]
  pull_request:
    branches: [ main, master, AI優化, 超級大改版 ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest -q

      - name: Validate configuration JSONs
        run: uv run python tools/validate_configs.py

      - name: Validate time boundaries
        run: uv run python tools/validate_time_boundaries.py

      - name: Verify integration scenarios
        run: uv run python tools/verify_integration_scenarios.py
