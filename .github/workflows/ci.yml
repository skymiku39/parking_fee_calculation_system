name: CI

on:
  push:
    branches: [ main, master, AI優化 ]
  pull_request:
    branches: [ main, master, AI優化 ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest -q

      - name: Validate configuration JSONs
        run: uv run python tools/validate_configs.py
