openapi: 3.0.3
info:
  title: 智能停車費率計算系統 API
  version: 1.0.0
  description: |-
    - 即時試算支援 plan_inline（不需先儲存）
    - 設計器任意段覆蓋驗證 API
    - 儲存用戶方案（v2 結構）
servers:
  - url: /
paths:
  /api/calculate:
    post:
      summary: 統一的費用計算API（支援 plan_inline 即時試算）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enter_time, exit_time]
              properties:
                enter_time:
                  type: string
                  example: "2025-06-20T21:52"
                exit_time:
                  type: string
                  example: "2025-06-21T08:30"
                plan_id:
                  type: string
                  description: 既有方案ID；若提供 plan_inline 可省略
                manual_adjustment:
                  type: integer
                  default: 0
                plan_inline:
                  $ref: '#/components/schemas/PlanV2'
      responses:
        '200':
          description: 成功或業務錯誤
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  total_amount:
                    type: integer
                  session_details:
                    type: array
                    items:
                      type: object
                  calculation_summary:
                    type: string

  /api/rate_plans/save:
    post:
      summary: 儲存用戶自定義費率方案（v2）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanV2'
      responses:
        '200':
          description: 成功
        '400':
          description: 輸入或配置錯誤

  /api/enhanced/segments/validate:
    post:
      summary: 任意段時間覆蓋與重疊驗證
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                segments:
                  type: array
                  items:
                    type: object
                    required: [name, start, end]
                    properties:
                      name: { type: string }
                      start: { type: string, example: '08:00' }
                      end: { type: string, example: '22:00' }
      responses:
        '200':
          description: 驗證結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  total_minutes: { type: integer }
                  message: { type: string }

components:
  schemas:
    PlanV2:
      type: object
      required: [name, segment_type, holiday_type, segments]
      properties:
        name: { type: string }
        segment_type:
          type: string
          enum: ["全天", "二段", "三段", "任意段", "多時段"]
        holiday_type:
          type: string
          enum: ["無假日", "平日假日", "完整假日"]
        segments:
          type: array
          items:
            type: object
            required: [name, start, end]
            properties:
              name: { type: string }
              start: { type: string, example: '08:00' }
              end: { type: string, example: '22:00' }
        rate_matrix:
          type: object
          additionalProperties:
            type: object
            properties:
              unit_time: { type: integer, default: 60 }
              progressive_enabled: { type: boolean, default: false }
              progressive_rates:
                type: array
                items:
                  type: object
                  properties:
                    duration_minutes: { type: integer }
                    duration: { type: integer }
                    rate: { type: integer }
                    unit_time: { type: integer }
                    unit: { type: integer }
              simple_rate: { type: integer }
              grace_time: { type: integer, description: 區段級免費時間(分鐘) }
              segment_cap_enabled: { type: boolean }
              segment_cap_amount: { type: integer }
        global_caps:
          type: object
          properties:
            daily_cap_enabled: { type: boolean }
            daily_cap_amount: { type: integer }
            segment_caps_enabled: { type: boolean }
            cap_priority: { type: string, enum: [daily, segment, lower, higher] }
            global_grace_time: { type: integer, default: 0 }

