<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>停車費計算系統 - 精簡版</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .result-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 15px;
        padding: 20px;
        margin: 20px 0;
      }
      .billing-detail {
        background: #f8f9fa;
        border-left: 4px solid #007bff;
        margin: 10px 0;
        padding: 15px;
        border-radius: 5px;
      }
      .amount-highlight {
        font-size: 1.2em;
        font-weight: bold;
        color: #28a745;
      }
      .time-input {
        background: #fff;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 10px;
      }
      .time-input:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
      }
      .calc-btn {
        background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        border: none;
        border-radius: 10px;
        padding: 12px 30px;
        font-weight: bold;
        color: white;
        transition: all 0.3s;
      }
      .calc-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- 導航欄 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-car"></i> 停車費計算系統 DEMO
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link active" href="/">
            <i class="fas fa-calculator"></i> 計算器
          </a>
          <a class="nav-link" href="/rate_editor">
            <i class="fas fa-edit"></i> 費率編輯
          </a>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <!-- 標題 -->
      <div class="text-center mb-4">
        <h1 class="display-4 text-primary">
          <i class="fas fa-car"></i> 停車費計算系統
        </h1>
        <p class="lead text-muted">精簡版 - 專注於準確的跨日停車計費</p>
      </div>

      <!-- 計算表單 -->
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0"><i class="fas fa-calculator"></i> 停車費計算</h4>
            </div>
            <div class="card-body p-4">
              <form id="calculationForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">
                      <i class="fas fa-sign-in-alt text-success"></i> 進場時間
                    </label>
                    <input
                      type="datetime-local"
                      id="enterTime"
                      class="form-control time-input"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">
                      <i class="fas fa-sign-out-alt text-danger"></i> 出場時間
                    </label>
                    <input
                      type="datetime-local"
                      id="exitTime"
                      class="form-control time-input"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">
                    <i class="fas fa-list-alt text-info"></i> 費率方案
                  </label>
                  <select
                    id="planSelect"
                    class="form-select time-input"
                    required
                  >
                    <option value="">請選擇費率方案</option>
                    {% for plan in rate_plans %}
                    <option value="{{ plan }}">{{ plan }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="text-center">
                  <button type="submit" class="btn calc-btn btn-lg">
                    <i class="fas fa-calculator"></i> 計算停車費
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- 計算結果 -->
      <div id="resultSection" style="display: none">
        <div class="row justify-content-center mt-4">
          <div class="col-md-10">
            <div class="result-card shadow-lg">
              <div class="row align-items-center">
                <div class="col-md-8">
                  <h3><i class="fas fa-receipt"></i> 計算結果</h3>
                  <p class="mb-1">
                    <strong>停車時間：</strong><span id="resultDuration"></span>
                  </p>
                  <p class="mb-1">
                    <strong>費率方案：</strong><span id="resultPlan"></span>
                  </p>
                  <p class="mb-0">
                    <strong>計算時間：</strong><span id="resultTime"></span>
                  </p>
                </div>
                <div class="col-md-4 text-end">
                  <div class="display-4 fw-bold" id="totalAmount">$0</div>
                  <small>新台幣 元</small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 詳細明細 -->
        <div class="row justify-content-center mt-3">
          <div class="col-md-10">
            <div class="card shadow">
              <div class="card-header bg-info text-white">
                <h5 class="mb-0"><i class="fas fa-list"></i> 計費明細</h5>
              </div>
              <div class="card-body p-0">
                <div id="billingDetails"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 錯誤訊息 -->
      <div
        id="errorAlert"
        class="alert alert-danger mt-3"
        style="display: none"
      >
        <i class="fas fa-exclamation-triangle"></i>
        <span id="errorMessage"></span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // 設定預設時間
      function setDefaultTimes() {
        const now = new Date();
        const enterTime = new Date(now.getTime() - 2 * 60 * 60 * 1000); // 2小時前

        document.getElementById("enterTime").value =
          formatDateTimeLocal(enterTime);
        document.getElementById("exitTime").value = formatDateTimeLocal(now);
      }

      function formatDateTimeLocal(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        const hours = String(date.getHours()).padStart(2, "0");
        const minutes = String(date.getMinutes()).padStart(2, "0");
        return `${year}-${month}-${day}T${hours}:${minutes}`;
      }

      // 表單提交處理
      document
        .getElementById("calculationForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const enterTime = document.getElementById("enterTime").value;
          const exitTime = document.getElementById("exitTime").value;
          const planId = document.getElementById("planSelect").value;

          if (!enterTime || !exitTime || !planId) {
            showError("請填寫完整資訊");
            return;
          }

          // 顯示載入狀態
          const submitBtn = document.querySelector('button[type="submit"]');
          const originalText = submitBtn.innerHTML;
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> 計算中...';
          submitBtn.disabled = true;

          try {
            const response = await fetch("/api/calculate", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                enter_time: enterTime,
                exit_time: exitTime,
                plan_id: planId,
              }),
            });

            const result = await response.json();

            if (result.success) {
              displayResult(result);
              hideError();
            } else {
              showError(result.error);
            }
          } catch (error) {
            showError("計算請求失敗，請檢查網路連接");
          } finally {
            // 恢復按鈕狀態
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
          }
        });

      function displayResult(result) {
        // 顯示總金額
        document.getElementById(
          "totalAmount"
        ).textContent = `$${result.total_amount}`;
        document.getElementById("resultDuration").textContent =
          result.total_duration;
        document.getElementById("resultPlan").textContent = result.plan_name;
        document.getElementById(
          "resultTime"
        ).textContent = `${result.enter_time} ~ ${result.exit_time}`;

        // 顯示詳細明細
        const detailsContainer = document.getElementById("billingDetails");
        detailsContainer.innerHTML = "";

        result.billing_details.forEach((detail, index) => {
          const detailDiv = document.createElement("div");
          detailDiv.className = "billing-detail";
          detailDiv.innerHTML = `
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <strong>${detail.period}</strong>
                            <br>
                            <small class="text-muted">${detail.duration} | ${detail.rate}</small>
                        </div>
                        <div class="col-md-6 text-end">
                            <span class="amount-highlight">${detail.amount} 元</span>
                        </div>
                    </div>
                `;
          detailsContainer.appendChild(detailDiv);
        });

        // 顯示結果區域
        document.getElementById("resultSection").style.display = "block";

        // 滾動到結果區域
        document.getElementById("resultSection").scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
      }

      function showError(message) {
        document.getElementById("errorMessage").textContent = message;
        document.getElementById("errorAlert").style.display = "block";
        document.getElementById("resultSection").style.display = "none";
      }

      function hideError() {
        document.getElementById("errorAlert").style.display = "none";
      }

      // 頁面載入時設定預設時間
      document.addEventListener("DOMContentLoaded", function () {
        setDefaultTimes();
      });
    </script>
  </body>
</html>
