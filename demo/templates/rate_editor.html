<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>費率方案編輯器 - DEMO</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .rate-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 15px;
        padding: 20px;
        margin: 10px 0;
      }
      .segment-card {
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 15px;
        margin: 10px 0;
        background: #f8f9fa;
      }
      .rate-input {
        background: #fff;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 8px;
      }
      .rate-input:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
      }
      .save-btn {
        background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        border: none;
        border-radius: 10px;
        padding: 12px 30px;
        font-weight: bold;
        color: white;
        transition: all 0.3s;
      }
      .save-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
      }
      .add-btn {
        background: linear-gradient(135deg, #007bff 0%, #6610f2 100%);
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        color: white;
      }
      .delete-btn {
        background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);
        border: none;
        border-radius: 8px;
        padding: 5px 15px;
        color: white;
      }
      .nav-tabs .nav-link.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
      }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-car"></i> 停車費計算系統 DEMO
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/">
            <i class="fas fa-calculator"></i> 計算器
          </a>
          <a class="nav-link active" href="/rate_editor">
            <i class="fas fa-edit"></i> 費率編輯
          </a>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <!-- 標題 -->
      <div class="text-center mb-4">
        <h1 class="display-5 text-primary">
          <i class="fas fa-edit"></i> 費率方案編輯器
        </h1>
        <p class="lead text-muted">管理和編輯停車費率方案</p>
      </div>

      <!-- 方案選擇 -->
      <div class="row justify-content-center mb-4">
        <div class="col-md-8">
          <div class="card shadow">
            <div class="card-header bg-info text-white">
              <h5 class="mb-0"><i class="fas fa-list"></i> 選擇編輯方案</h5>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-8">
                  <select id="planSelect" class="form-select rate-input">
                    <option value="">選擇要編輯的方案</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <button class="btn add-btn w-100" onclick="createNewPlan()">
                    <i class="fas fa-plus"></i> 新增方案
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 編輯區域 -->
      <div id="editorSection" style="display: none">
        <div class="row justify-content-center">
          <div class="col-md-10">
            <div class="card shadow-lg border-0">
              <div class="card-header">
                <ul class="nav nav-tabs card-header-tabs" role="tablist">
                  <li class="nav-item">
                    <a
                      class="nav-link active"
                      data-bs-toggle="tab"
                      href="#basicInfo"
                    >
                      <i class="fas fa-info-circle"></i> 基本資訊
                    </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#segments">
                      <i class="fas fa-clock"></i> 時段設定
                    </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#rates">
                      <i class="fas fa-dollar-sign"></i> 費率設定
                    </a>
                  </li>
                </ul>
              </div>
              <div class="card-body">
                <div class="tab-content">
                  <!-- 基本資訊 -->
                  <div class="tab-pane fade show active" id="basicInfo">
                    <h5>
                      <i class="fas fa-info-circle text-primary"></i>
                      方案基本資訊
                    </h5>
                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">方案名稱</label>
                        <input
                          type="text"
                          id="planName"
                          class="form-control rate-input"
                          placeholder="輸入方案名稱"
                        />
                      </div>
                      <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">假日模式</label>
                        <select id="holidayMode" class="form-select rate-input">
                          <option value="weekday_weekend">平日假日模式</option>
                          <option value="uniform">統一費率模式</option>
                        </select>
                      </div>
                    </div>
                    <div class="mb-3">
                      <label class="form-label fw-bold">方案描述</label>
                      <textarea
                        id="planDescription"
                        class="form-control rate-input"
                        rows="3"
                        placeholder="輸入方案描述"
                      ></textarea>
                    </div>
                  </div>

                  <!-- 時段設定 -->
                  <div class="tab-pane fade" id="segments">
                    <div
                      class="d-flex justify-content-between align-items-center mb-3"
                    >
                      <h5>
                        <i class="fas fa-clock text-primary"></i> 時段設定
                      </h5>
                      <button class="btn add-btn" onclick="addSegment()">
                        <i class="fas fa-plus"></i> 新增時段
                      </button>
                    </div>
                    <div id="segmentsList">
                      <!-- 時段列表將在這裡動態生成 -->
                    </div>
                  </div>

                  <!-- 費率設定 -->
                  <div class="tab-pane fade" id="rates">
                    <h5>
                      <i class="fas fa-dollar-sign text-primary"></i> 費率設定
                    </h5>
                    <div id="ratesList">
                      <!-- 費率列表將在這裡動態生成 -->
                    </div>
                  </div>
                </div>
              </div>
              <div class="card-footer text-center">
                <button class="btn save-btn btn-lg me-3" onclick="savePlan()">
                  <i class="fas fa-save"></i> 儲存方案
                </button>
                <button
                  class="btn btn-secondary btn-lg me-3"
                  onclick="testPlan()"
                >
                  <i class="fas fa-test-tube"></i> 測試方案
                </button>
                <button class="btn delete-btn btn-lg" onclick="deletePlan()">
                  <i class="fas fa-trash"></i> 刪除方案
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 測試結果 -->
      <div id="testResults" class="mt-4" style="display: none">
        <div class="row justify-content-center">
          <div class="col-md-10">
            <div class="card shadow">
              <div class="card-header bg-success text-white">
                <h5 class="mb-0">
                  <i class="fas fa-check-circle"></i> 測試結果
                </h5>
              </div>
              <div class="card-body">
                <div id="testOutput"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 訊息提示 -->
      <div id="messageAlert" class="alert mt-3" style="display: none">
        <span id="messageText"></span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let currentPlan = {};
      let segmentCounter = 0;

      // 頁面載入時初始化
      document.addEventListener("DOMContentLoaded", function () {
        loadPlansList();
      });

      // 載入方案列表
      async function loadPlansList() {
        try {
          const response = await fetch("/api/plans");
          const result = await response.json();

          if (result.success) {
            const select = document.getElementById("planSelect");
            select.innerHTML = '<option value="">選擇要編輯的方案</option>';

            Object.keys(result.plans).forEach((planId) => {
              const option = document.createElement("option");
              option.value = planId;
              option.textContent = result.plans[planId].name;
              select.appendChild(option);
            });
          }
        } catch (error) {
          showMessage("載入方案列表失敗", "danger");
        }
      }

      // 方案選擇變更
      document
        .getElementById("planSelect")
        .addEventListener("change", function () {
          const planId = this.value;
          if (planId) {
            loadPlan(planId);
          } else {
            document.getElementById("editorSection").style.display = "none";
          }
        });

      // 載入方案資料
      async function loadPlan(planId) {
        try {
          const response = await fetch(`/api/plans/${planId}`);
          const result = await response.json();

          if (result.success) {
            currentPlan = result.plan;
            populateEditor(currentPlan);
            document.getElementById("editorSection").style.display = "block";
          } else {
            showMessage("載入方案失敗", "danger");
          }
        } catch (error) {
          showMessage("載入方案失敗", "danger");
        }
      }

      // 填充編輯器
      function populateEditor(plan) {
        // 基本資訊
        document.getElementById("planName").value = plan.name || "";
        document.getElementById("holidayMode").value =
          plan.holiday_mode || "weekday_weekend";
        document.getElementById("planDescription").value =
          plan.description || "";

        // 時段設定
        populateSegments(plan.segments || []);

        // 費率設定
        populateRates(plan.rates || {});
      }

      // 填充時段設定
      function populateSegments(segments) {
        const container = document.getElementById("segmentsList");
        container.innerHTML = "";
        segmentCounter = 0;

        segments.forEach((segment) => {
          addSegmentCard(segment);
        });

        if (segments.length === 0) {
          addSegmentCard();
        }
      }

      // 新增時段卡片
      function addSegmentCard(segment = null) {
        const container = document.getElementById("segmentsList");
        const segmentId = segmentCounter++;

        const card = document.createElement("div");
        card.className = "segment-card";
        card.innerHTML = `
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">時段名稱</label>
                        <input type="text" class="form-control rate-input" id="segmentName_${segmentId}" 
                               value="${
                                 segment?.name || ""
                               }" placeholder="如：日間">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">開始時間</label>
                        <input type="time" class="form-control rate-input" id="segmentStart_${segmentId}" 
                               value="${segment?.start || ""}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">結束時間</label>
                        <input type="time" class="form-control rate-input" id="segmentEnd_${segmentId}" 
                               value="${segment?.end || ""}">
                    </div>
                    <div class="col-md-3 text-end">
                        <button class="btn delete-btn" onclick="removeSegment(this)">
                            <i class="fas fa-trash"></i> 刪除
                        </button>
                    </div>
                </div>
            `;

        container.appendChild(card);
      }

      // 新增時段
      function addSegment() {
        addSegmentCard();
      }

      // 移除時段
      function removeSegment(button) {
        button.closest(".segment-card").remove();
        updateRatesDisplay();
      }

      // 填充費率設定
      function populateRates(rates) {
        updateRatesDisplay();

        // 填入現有費率資料
        Object.keys(rates).forEach((segmentName) => {
          Object.keys(rates[segmentName]).forEach((dateType) => {
            const rate = rates[segmentName][dateType];
            const rateInput = document.getElementById(
              `rate_${segmentName}_${dateType}`
            );
            const unitInput = document.getElementById(
              `unit_${segmentName}_${dateType}`
            );
            const capInput = document.getElementById(
              `cap_${segmentName}_${dateType}`
            );

            if (rateInput) rateInput.value = rate.rate || 0;
            if (unitInput) unitInput.value = rate.unit || 60;
            if (capInput) capInput.value = rate.cap || 0;
          });
        });
      }

      // 更新費率顯示
      function updateRatesDisplay() {
        const container = document.getElementById("ratesList");
        const segments = getSegmentsFromForm();
        const holidayMode = document.getElementById("holidayMode").value;

        container.innerHTML = "";

        if (segments.length === 0) {
          container.innerHTML = '<p class="text-muted">請先設定時段</p>';
          return;
        }

        const dateTypes =
          holidayMode === "weekday_weekend" ? ["平日", "假日"] : ["統一"];

        segments.forEach((segment) => {
          const segmentCard = document.createElement("div");
          segmentCard.className = "rate-card mb-3";

          let ratesHtml = "";
          dateTypes.forEach((dateType) => {
            ratesHtml += `
                        <div class="col-md-4 mb-2">
                            <label class="form-label">${segment.name} - ${dateType}</label>
                            <div class="row">
                                <div class="col-4">
                                    <input type="number" class="form-control rate-input" 
                                           id="rate_${segment.name}_${dateType}" 
                                           placeholder="費率" min="0">
                                    <small class="text-light">費率(元)</small>
                                </div>
                                <div class="col-4">
                                    <input type="number" class="form-control rate-input" 
                                           id="unit_${segment.name}_${dateType}" 
                                           placeholder="單位" min="1" value="60">
                                    <small class="text-light">單位(分)</small>
                                </div>
                                <div class="col-4">
                                    <input type="number" class="form-control rate-input" 
                                           id="cap_${segment.name}_${dateType}" 
                                           placeholder="上限" min="0">
                                    <small class="text-light">上限(元)</small>
                                </div>
                            </div>
                        </div>
                    `;
          });

          segmentCard.innerHTML = `
                    <h6><i class="fas fa-clock"></i> ${segment.name} (${segment.start} - ${segment.end})</h6>
                    <div class="row">
                        ${ratesHtml}
                    </div>
                `;

          container.appendChild(segmentCard);
        });
      }

      // 從表單獲取時段資料
      function getSegmentsFromForm() {
        const segments = [];
        const segmentCards = document.querySelectorAll(".segment-card");

        segmentCards.forEach((card, index) => {
          const name = card.querySelector(`input[id^="segmentName_"]`).value;
          const start = card.querySelector(`input[id^="segmentStart_"]`).value;
          const end = card.querySelector(`input[id^="segmentEnd_"]`).value;

          if (name && start && end) {
            segments.push({ name, start, end });
          }
        });

        return segments;
      }

      // 監聽時段變更
      document.addEventListener("input", function (e) {
        if (
          e.target.id.startsWith("segmentName_") ||
          e.target.id.startsWith("segmentStart_") ||
          e.target.id.startsWith("segmentEnd_")
        ) {
          updateRatesDisplay();
        }
      });

      // 監聽假日模式變更
      document
        .getElementById("holidayMode")
        .addEventListener("change", function () {
          updateRatesDisplay();
        });

      // 創建新方案
      function createNewPlan() {
        currentPlan = {
          name: "新方案",
          description: "",
          holiday_mode: "weekday_weekend",
          segments: [
            { name: "日間", start: "07:00", end: "18:00" },
            { name: "夜間", start: "18:00", end: "07:00" },
          ],
          rates: {},
        };

        populateEditor(currentPlan);
        document.getElementById("editorSection").style.display = "block";
        document.getElementById("planSelect").value = "";
      }

      // 儲存方案
      async function savePlan() {
        try {
          const planData = {
            name: document.getElementById("planName").value,
            description: document.getElementById("planDescription").value,
            holiday_mode: document.getElementById("holidayMode").value,
            segments: getSegmentsFromForm(),
            rates: getRatesFromForm(),
          };

          if (!planData.name) {
            showMessage("請填寫方案名稱", "warning");
            return;
          }

          if (planData.segments.length === 0) {
            showMessage("請至少設定一個時段", "warning");
            return;
          }

          const response = await fetch("/api/plans/save", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(planData),
          });

          const result = await response.json();

          if (result.success) {
            showMessage("方案儲存成功", "success");
            loadPlansList();
          } else {
            showMessage(`儲存失敗：${result.error}`, "danger");
          }
        } catch (error) {
          showMessage("儲存失敗", "danger");
        }
      }

      // 從表單獲取費率資料
      function getRatesFromForm() {
        const rates = {};
        const segments = getSegmentsFromForm();
        const holidayMode = document.getElementById("holidayMode").value;
        const dateTypes =
          holidayMode === "weekday_weekend" ? ["平日", "假日"] : ["統一"];

        segments.forEach((segment) => {
          rates[segment.name] = {};
          dateTypes.forEach((dateType) => {
            const rateInput = document.getElementById(
              `rate_${segment.name}_${dateType}`
            );
            const unitInput = document.getElementById(
              `unit_${segment.name}_${dateType}`
            );
            const capInput = document.getElementById(
              `cap_${segment.name}_${dateType}`
            );

            if (rateInput && unitInput && capInput) {
              rates[segment.name][dateType] = {
                rate: parseInt(rateInput.value) || 0,
                unit: parseInt(unitInput.value) || 60,
                cap: parseInt(capInput.value) || 0,
              };
            }
          });
        });

        return rates;
      }

      // 測試方案
      async function testPlan() {
        const planData = {
          name: document.getElementById("planName").value,
          segments: getSegmentsFromForm(),
          rates: getRatesFromForm(),
          holiday_mode: document.getElementById("holidayMode").value,
        };

        // 使用測試案例
        const testCases = [
          {
            name: "基本測試",
            enter_time: "2025-06-20T10:00",
            exit_time: "2025-06-20T14:00",
          },
          {
            name: "跨日測試",
            enter_time: "2025-06-20T20:00",
            exit_time: "2025-06-21T08:00",
          },
        ];

        let testHtml = "<h6>測試結果：</h6>";

        for (const testCase of testCases) {
          try {
            const response = await fetch("/api/test_plan", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                plan_data: planData,
                ...testCase,
              }),
            });

            const result = await response.json();

            if (result.success) {
              testHtml += `
                            <div class="border p-2 mb-2">
                                <strong>${testCase.name}</strong><br>
                                進場：${testCase.enter_time} → 出場：${testCase.exit_time}<br>
                                費用：<span class="text-success fw-bold">${result.total_amount}元</span>
                            </div>
                        `;
            } else {
              testHtml += `
                            <div class="border p-2 mb-2 bg-danger text-white">
                                <strong>${testCase.name}</strong><br>
                                錯誤：${result.error}
                            </div>
                        `;
            }
          } catch (error) {
            testHtml += `
                        <div class="border p-2 mb-2 bg-danger text-white">
                            <strong>${testCase.name}</strong><br>
                            測試失敗
                        </div>
                    `;
          }
        }

        document.getElementById("testOutput").innerHTML = testHtml;
        document.getElementById("testResults").style.display = "block";
      }

      // 刪除方案
      async function deletePlan() {
        const planName = document.getElementById("planName").value;
        if (!planName) {
          showMessage("沒有可刪除的方案", "warning");
          return;
        }

        if (!confirm(`確定要刪除方案「${planName}」嗎？`)) {
          return;
        }

        try {
          const response = await fetch(
            `/api/plans/delete/${encodeURIComponent(planName)}`,
            {
              method: "DELETE",
            }
          );

          const result = await response.json();

          if (result.success) {
            showMessage("方案刪除成功", "success");
            document.getElementById("editorSection").style.display = "none";
            loadPlansList();
          } else {
            showMessage(`刪除失敗：${result.error}`, "danger");
          }
        } catch (error) {
          showMessage("刪除失敗", "danger");
        }
      }

      // 顯示訊息
      function showMessage(message, type) {
        const alert = document.getElementById("messageAlert");
        const text = document.getElementById("messageText");

        alert.className = `alert alert-${type} mt-3`;
        text.textContent = message;
        alert.style.display = "block";

        setTimeout(() => {
          alert.style.display = "none";
        }, 3000);
      }
    </script>
  </body>
</html>
