{% extends "layout/base.html" %}
{% block title %}自訂方案設計器 - 智能停車費率計算系統{% endblock %}
{% block page_title %}<i class="fas fa-edit me-2"></i> 自訂方案設計器{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="card-modern mb-4">
    <div class="d-flex justify-content-between align-items-center p-3 flex-wrap gap-2">
      <div class="text-sm text-gray-600">
        編輯使用者自訂方案（收費週期格式），儲存至 <code>user_defined_plans.json</code>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn-modern btn-outline btn-sm" onclick="window.location.href='/plan_manager'">
          <i class="fas fa-arrow-left"></i> 返回管理
        </button>
        <button class="btn-modern btn-outline btn-sm" onclick="downloadPlan()">
          <i class="fas fa-download"></i> 匯出
        </button>
        <button class="btn-modern btn-gradient-primary btn-sm" onclick="savePlan()">
          <i class="fas fa-save"></i> 儲存
        </button>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card-modern">
        <div class="card-modern-header">
          <div class="card-modern-title"><i class="fas fa-info-circle"></i> 基本資訊</div>
        </div>
        <div class="card-modern-body">
          <div class="form-group-modern">
            <label for="plan_id"><i class="fas fa-hashtag me-2"></i>方案 ID</label>
            <input id="plan_id" type="text" class="form-control-modern" placeholder="例：跨日測試方案" />
          </div>
          <div class="form-group-modern">
            <label for="plan_name"><i class="fas fa-tag me-2"></i>顯示名稱</label>
            <input id="plan_name" type="text" class="form-control-modern" placeholder="例：跨日測試方案" />
          </div>
          <div class="form-group-modern">
            <label for="plan_description"><i class="fas fa-align-left me-2"></i>說明</label>
            <textarea id="plan_description" class="form-control-modern" rows="2"></textarea>
          </div>
          <div class="form-group-modern">
            <label for="segment_type"><i class="fas fa-clock me-2"></i>時段類型</label>
            <select id="segment_type" class="form-control-modern" onchange="onSegmentTypeChange()">
              <option value="全天">全天</option>
              <option value="二段" selected>二段</option>
              <option value="三段">三段</option>
              <option value="多時段">多時段</option>
              <option value="任意段">任意段</option>
            </select>
          </div>
          <div class="form-group-modern">
            <label for="holiday_type"><i class="fas fa-calendar me-2"></i>假日類型</label>
            <select id="holiday_type" class="form-control-modern" onchange="renderMatrix()">
              <option value="無假日">無假日</option>
              <option value="平日假日" selected>平日假日</option>
              <option value="完整假日">完整假日</option>
            </select>
          </div>
          <div class="form-group-modern">
            <label for="global_grace"><i class="fas fa-gift me-2"></i>全域寬限時間（分鐘）</label>
            <input id="global_grace" type="number" class="form-control-modern" value="0" min="0" />
          </div>
          <div class="form-group-modern">
            <label for="daily_cap_amount"><i class="fas fa-coins me-2"></i>日上限金額（元，0 表示無）</label>
            <input id="daily_cap_amount" type="number" class="form-control-modern" value="0" min="0" />
          </div>
          <div class="form-check mb-2">
            <input id="featured" type="checkbox" class="form-check-input" />
            <label for="featured" class="form-check-label">標記為精選方案</label>
          </div>
          <div class="form-check mb-3">
            <input id="active" type="checkbox" class="form-check-input" checked />
            <label for="active" class="form-check-label">啟用方案</label>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <button class="btn-modern btn-error btn-sm" onclick="deletePlan()">
              <i class="fas fa-trash"></i> 刪除
            </button>
          </div>
          <div id="msg" class="mt-3"></div>
        </div>
      </div>

      <div class="card-modern mt-3">
        <div class="card-modern-header">
          <div class="card-modern-title"><i class="fas fa-th-list"></i> 時間區段</div>
          <div class="d-flex gap-2">
            <button class="btn-modern btn-success btn-sm" onclick="validateSegments()"><i class="fas fa-check"></i> 驗證</button>
            <button id="btnAddSeg" class="btn-modern btn-outline btn-sm" onclick="addSegment()"><i class="fas fa-plus"></i> 新增</button>
          </div>
        </div>
        <div class="card-modern-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr><th>名稱</th><th>開始</th><th>結束</th><th></th></tr>
              </thead>
              <tbody id="segBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card-modern mb-4">
        <div class="card-modern-header">
          <div class="card-modern-title"><i class="fas fa-table"></i> 費率矩陣</div>
        </div>
        <div class="card-modern-body">
          <div id="matrixHost" class="table-responsive"></div>
        </div>
      </div>

      <div class="card-modern">
        <div class="card-modern-header">
          <div class="card-modern-title"><i class="fas fa-calculator"></i> 即時試算</div>
        </div>
        <div class="card-modern-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-5">
              <label for="preview_enter">進場時間</label>
              <input id="preview_enter" type="datetime-local" class="form-control-modern" />
            </div>
            <div class="col-md-5">
              <label for="preview_exit">出場時間</label>
              <input id="preview_exit" type="datetime-local" class="form-control-modern" />
            </div>
            <div class="col-md-2">
              <button class="btn-modern btn-gradient-secondary btn-full" onclick="previewCalculate()">
                <i class="fas fa-bolt"></i> 試算
              </button>
            </div>
          </div>
          <div id="previewBox" class="mt-3" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/plan-designer-core.js"></script>
<script src="/static/js/preview-result.js"></script>
<script>
  let segments = [
    { name: '日間', start: '08:00', end: '22:00' },
    { name: '夜間', start: '22:00', end: '08:00' }
  ];
  let matrix = {};

  document.addEventListener('DOMContentLoaded', async () => {
    initPreviewTimes();
    const url = new URL(window.location.href);
    const planId = url.searchParams.get('plan_id');
    if (planId) {
      await loadPlan(planId);
    } else {
      renderSegments();
      renderMatrix();
    }
  });

  function initPreviewTimes() {
    const now = new Date();
    const enter = new Date(now.getTime() - 2 * 60 * 60 * 1000);
    document.getElementById('preview_enter').value = formatDateTimeLocal(enter);
    document.getElementById('preview_exit').value = formatDateTimeLocal(now);
  }

  function formatDateTimeLocal(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    const h = String(date.getHours()).padStart(2, '0');
    const min = String(date.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${d}T${h}:${min}`;
  }

  async function loadPlan(planId) {
    try {
      const resp = await fetch(`/api/rate_plans/load/${encodeURIComponent(planId)}`);
      const data = await resp.json();
      if (!data.success) return showMsg('danger', '載入失敗：' + (data.message || data.error));
      populateFromPlan(planId, data.plan || {});
    } catch (e) {
      showMsg('danger', '載入失敗：' + (e.message || e));
    }
  }

  function populateFromPlan(planId, plan) {
    document.getElementById('plan_id').value = planId;
    document.getElementById('plan_name').value = plan.name || planId;
    document.getElementById('plan_description').value = plan.description || '';
    document.getElementById('segment_type').value = plan.segment_type || '二段';
    document.getElementById('holiday_type').value = plan.holiday_type || '平日假日';
    const caps = plan.global_caps || {};
    document.getElementById('global_grace').value = caps.global_grace_time || plan.global_grace_time || 0;
    document.getElementById('daily_cap_amount').value = caps.daily_cap_amount || 0;
    document.getElementById('featured').checked = !!plan.featured;
    document.getElementById('active').checked = plan.active !== false;

    segments = (plan.segments || []).map(s => ({
      name: s.name,
      start: s.start,
      end: s.end
    }));
    if (!segments.length) onSegmentTypeChange();

    matrix = {};
    const rateMatrix = plan.rate_matrix || {};
    Object.entries(rateMatrix).forEach(([key, cfg]) => {
      matrix[key] = {
        unit: cfg.unit_time || 60,
        rate: cfg.simple_rate || 0,
        grace: cfg.grace_time || 0,
        capEnabled: !!cfg.segment_cap_enabled,
        capAmount: cfg.segment_cap_amount || 0
      };
    });

    renderSegments();
    renderMatrix();
    showMsg('success', '方案已載入');
  }

  function onSegmentTypeChange() {
    const t = document.getElementById('segment_type').value;
    if (t === '全天') {
      segments = [{ name: '全天', start: '00:00', end: '24:00' }];
    } else if (t === '二段') {
      segments = [
        { name: '日間', start: '08:00', end: '22:00' },
        { name: '夜間', start: '22:00', end: '08:00' }
      ];
    } else if (t === '三段') {
      segments = [
        { name: '早間', start: '07:00', end: '12:00' },
        { name: '日間', start: '12:00', end: '20:00' },
        { name: '夜間', start: '20:00', end: '07:00' }
      ];
    }
    renderSegments();
    renderMatrix();
  }

  function renderSegments() {
    const t = document.getElementById('segment_type').value;
    const addBtn = document.getElementById('btnAddSeg');
    if (addBtn) {
      addBtn.style.display = (t === '多時段' || t === '任意段') ? '' : 'none';
    }
    const body = document.getElementById('segBody');
    body.innerHTML = '';
    const editable = t === '多時段' || t === '任意段';
    segments.forEach((s, i) => {
      const tr = document.createElement('tr');
      const nameInput = editable
        ? `<input class="form-control form-control-sm" value="${escapeHtml(s.name)}" oninput="segEdit(${i},'name',this.value)"/>`
        : escapeHtml(s.name);
      tr.innerHTML = `
        <td>${nameInput}</td>
        <td><input class="form-control form-control-sm" value="${escapeHtml(s.start)}" oninput="segEdit(${i},'start',this.value)"/></td>
        <td><input class="form-control form-control-sm" value="${escapeHtml(s.end)}" oninput="segEdit(${i},'end',this.value)"/></td>
        <td>${editable ? `<button class="btn btn-sm btn-outline-danger" onclick="segRemove(${i})"><i class="fas fa-times"></i></button>` : ''}</td>`;
      body.appendChild(tr);
    });
  }

  function buildPlanPayload() {
    const planId = (document.getElementById('plan_id').value || '').trim();
    const name = (document.getElementById('plan_name').value || '').trim() || planId;
    const dailyCap = parseInt(document.getElementById('daily_cap_amount').value) || 0;
    const globalGrace = parseInt(document.getElementById('global_grace').value) || 0;
    const rate_matrix = {};
    currentCategories().forEach(cat => {
      segments.forEach(seg => {
        const key = `${seg.name}_${cat}`;
        const cell = matrix[key] || { unit: 60, rate: 0, grace: 0, capEnabled: false, capAmount: 0 };
        rate_matrix[key] = {
          unit_time: Number(cell.unit || 60),
          simple_rate: Number(cell.rate || 0),
          grace_time: Number(cell.grace || 0),
          progressive_enabled: false,
          segment_cap_enabled: !!cell.capEnabled,
          segment_cap_amount: Number(cell.capAmount || 0)
        };
      });
    });
    return {
      plan_id: planId,
      plan: {
        name,
        description: document.getElementById('plan_description').value || '',
        segment_type: document.getElementById('segment_type').value,
        holiday_type: document.getElementById('holiday_type').value,
        segments: segments.map(s => ({ name: s.name, start: s.start, end: s.end })),
        rate_matrix,
        global_caps: {
          daily_cap_enabled: dailyCap > 0,
          daily_cap_amount: dailyCap > 0 ? dailyCap : null,
          segment_caps_enabled: false,
          cap_priority: 'daily',
          global_grace_time: globalGrace
        },
        featured: document.getElementById('featured').checked,
        active: document.getElementById('active').checked
      }
    };
  }

  async function savePlan() {
    try {
      const payload = buildPlanPayload();
      if (!payload.plan_id) return showMsg('danger', '請填寫方案 ID');
      const resp = await fetch('/api/rate_plans/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (data.success) {
        document.getElementById('plan_id').value = data.plan_id;
        showMsg('success', '已儲存：' + data.plan_id);
      } else {
        showMsg('danger', '儲存失敗：' + (data.message || data.error));
      }
    } catch (e) {
      showMsg('danger', '儲存失敗：' + (e.message || e));
    }
  }

  async function deletePlan() {
    const planId = (document.getElementById('plan_id').value || '').trim();
    if (!planId) return showMsg('danger', '請先填寫方案 ID');
    if (!confirm(`確定刪除方案「${planId}」？`)) return;
    try {
      const resp = await fetch(`/api/rate_plans/${encodeURIComponent(planId)}`, { method: 'DELETE' });
      const data = await resp.json();
      if (data.success) {
        showMsg('success', '已刪除');
        setTimeout(() => { window.location.href = '/plan_manager'; }, 800);
      } else {
        showMsg('danger', '刪除失敗：' + (data.message || data.error));
      }
    } catch (e) {
      showMsg('danger', '刪除失敗：' + (e.message || e));
    }
  }

  function downloadPlan() {
    const payload = buildPlanPayload();
    const blob = new Blob([JSON.stringify(payload.plan, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (payload.plan_id || 'user_plan') + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function previewCalculate() {
    const enter = document.getElementById('preview_enter').value;
    const exit = document.getElementById('preview_exit').value;
    const box = document.getElementById('previewBox');
    if (!enter || !exit) {
      box.style.display = 'block';
      box.className = 'alert alert-warning';
      box.textContent = '請輸入進出場時間';
      return;
    }
    try {
      const payload = buildPlanPayload();
      const resp = await fetch('/api/rate_plans/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          enter_time: enter,
          exit_time: exit,
          plan: payload.plan
        })
      });
      const data = await resp.json();
      box.style.display = 'block';
      if (data.success) {
        box.className = 'alert alert-success';
        box.innerHTML = renderPreviewDetails(data);
      } else {
        box.className = 'alert alert-danger';
        box.textContent = data.message || data.error || '試算失敗';
      }
    } catch (e) {
      box.style.display = 'block';
      box.className = 'alert alert-danger';
      box.textContent = e.message || '試算失敗';
    }
  }

  function showMsg(type, text) {
    const el = document.getElementById('msg');
    el.className = `mt-2 small text-${type === 'success' ? 'success' : 'danger'}`;
    el.textContent = text;
    setTimeout(() => { el.textContent = ''; }, 3000);
  }

</script>
{% endblock %}
