{% extends "layout/base.html" %}
{% block title %}API 文件 - 智能停車系統{% endblock %}
{% block page_title %}<i class="fas fa-book me-2"></i> API 文件{% endblock %}
{% block head %}
  <style>
    #swagger-ui {
      background: #fff;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 10px;
    }
  </style>
{% endblock %}
{% block content %}
  <div class="container-fluid">
    <div class="mb-3">
      <p class="text-muted mb-1">OpenAPI 檔案</p>
      <a class="btn btn-outline-secondary btn-sm" href="/static/openapi.yaml" target="_blank">
        <i class="fas fa-download"></i> 下載 openapi.yaml
      </a>
    </div>
    <div id="swagger-ui"></div>
  </div>
{% endblock %}
{% block scripts %}
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try {
        window.ui = SwaggerUIBundle({
          url: '/static/openapi.yaml',
          dom_id: '#swagger-ui',
          presets: [SwaggerUIBundle.presets.apis],
          layout: 'BaseLayout',
        });
      } catch (e) {
        console.error('Swagger 初始化失敗', e);
      }
    });
  </script>
{% endblock %}
