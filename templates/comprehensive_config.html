<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全面停車場費率配置系統</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .config-section {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        border-left: 4px solid #007bff;
      }
      .section-title {
        color: #007bff;
        font-weight: bold;
        margin-bottom: 15px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .pricing-model-card {
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .pricing-model-card:hover {
        border-color: #007bff;
        background-color: #f8f9fa;
      }
      .pricing-model-card.selected {
        border-color: #007bff;
        background-color: #e7f3ff;
      }
      .dynamic-form-section {
        display: none;
      }
      .time-slot-item {
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
      }
      .discount-rule-item {
        background: #fff3cd;
        border: 1px solid #ffeaa7;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
      }
      .vehicle-config-item {
        background: #d1ecf1;
        border: 1px solid #bee5eb;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
      }
      .monthly-plan-item {
        background: #d4edda;
        border: 1px solid #c3e6cb;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid py-4">
      <h1 class="text-center mb-4">
        <i class="fas fa-parking"></i>
        全面停車場費率配置系統
      </h1>

      <form id="comprehensiveConfigForm">
        <!-- 停車場基本資訊 -->
        <div class="config-section">
          <h3 class="section-title">
            <i class="fas fa-info-circle"></i>
            停車場基本資訊
          </h3>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="lotName">停車場名稱</label>
                <input
                  type="text"
                  class="form-control"
                  id="lotName"
                  placeholder="例：PACA 台北車站西側停車場"
                />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label for="lotType">停車場類型</label>
                <select class="form-control" id="lotType">
                  <option value="public_offstreet">公有路外</option>
                  <option value="commercial_complex">商業綜合體</option>
                  <option value="residential">住宅社區</option>
                  <option value="airport">機場</option>
                  <option value="hospital">醫院</option>
                  <option value="roadside">路邊</option>
                </select>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label for="operatingHours">營業時間</label>
                <select class="form-control" id="operatingHours">
                  <option value="24hours">24小時</option>
                  <option value="07:00-22:00">07:00-22:00</option>
                  <option value="custom">自訂時間</option>
                </select>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label for="minBillingUnit">最小計費單位</label>
                <select class="form-control" id="minBillingUnit">
                  <option value="15">15分鐘</option>
                  <option value="30">30分鐘</option>
                  <option value="60">1小時</option>
                </select>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label for="gracePeriod">寬限期 (分鐘)</label>
                <input
                  type="number"
                  class="form-control"
                  id="gracePeriod"
                  value="15"
                  min="0"
                  max="60"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- 計費模式選擇 -->
        <div class="config-section">
          <h3 class="section-title">
            <i class="fas fa-calculator"></i>
            計費模式選擇
          </h3>
          <div class="row">
            <div class="col-md-6">
              <div class="pricing-model-card" data-model="unified_flat_rate">
                <h5><i class="fas fa-clock"></i> 全天統一費率</h5>
                <p class="text-muted">24小時使用相同費率，簡單易懂</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="pricing-model-card" data-model="day_night_rates">
                <h5>
                  <i class="fas fa-sun"></i
                  ><i class="fas fa-moon"></i> 日間夜間費率
                </h5>
                <p class="text-muted">區分日間與夜間的兩段式費率</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="pricing-model-card" data-model="multi_segment_rates">
                <h5><i class="fas fa-chart-line"></i> 多段式費率</h5>
                <p class="text-muted">按不同時段設定的複雜費率規則</p>
              </div>
            </div>
            <div class="col-md-6">
              <div
                class="pricing-model-card"
                data-model="weekday_holiday_rates"
              >
                <h5><i class="fas fa-calendar-week"></i> 平日/假日費率</h5>
                <p class="text-muted">區分平日與假日的差異化費率</p>
              </div>
            </div>
            <div class="col-md-6">
              <div
                class="pricing-model-card"
                data-model="weekday_holiday_festival_rates"
              >
                <h5><i class="fas fa-calendar-alt"></i> 平日/假日/節慶費率</h5>
                <p class="text-muted">三段式費率，包含節慶假日特殊定價</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="pricing-model-card" data-model="per_entry_rate">
                <h5><i class="fas fa-ticket-alt"></i> 計次收費</h5>
                <p class="text-muted">每次進出收取固定費用</p>
              </div>
            </div>
          </div>
        </div>

        <!-- 動態配置區域 -->
        <div id="dynamicConfigSections"></div>

        <!-- 車輛類型配置 -->
        <div class="config-section">
          <h3 class="section-title">
            <i class="fas fa-car"></i>
            車輛類型配置
          </h3>
          <div id="vehicleTypeConfigs">
            <!-- 動態生成車輛類型配置 -->
          </div>
          <button
            type="button"
            class="btn btn-outline-primary"
            onclick="addVehicleTypeConfig()"
          >
            <i class="fas fa-plus"></i> 新增車輛類型
          </button>
        </div>

        <!-- 月租方案配置 -->
        <div class="config-section">
          <h3 class="section-title">
            <i class="fas fa-calendar-check"></i>
            長期停車方案 (月租)
          </h3>
          <div id="monthlyRentalPlans">
            <!-- 動態生成月租方案 -->
          </div>
          <button
            type="button"
            class="btn btn-outline-success"
            onclick="addMonthlyRentalPlan()"
          >
            <i class="fas fa-plus"></i> 新增月租方案
          </button>
        </div>

        <!-- 優惠與折扣機制 -->
        <div class="config-section">
          <h3 class="section-title">
            <i class="fas fa-tags"></i>
            優惠與折扣機制
          </h3>
          <div id="discountRules">
            <!-- 動態生成優惠規則 -->
          </div>
          <button
            type="button"
            class="btn btn-outline-warning"
            onclick="addDiscountRule()"
          >
            <i class="fas fa-plus"></i> 新增優惠規則
          </button>
        </div>

        <!-- 動態定價配置 -->
        <div class="config-section">
          <h3 class="section-title">
            <i class="fas fa-chart-bar"></i>
            動態定價配置
          </h3>
          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              id="enableDynamicPricing"
            />
            <label class="form-check-label" for="enableDynamicPricing">
              啟用動態定價功能
            </label>
          </div>
          <div id="dynamicPricingConfig" style="display: none">
            <div class="row">
              <div class="col-md-6">
                <h5>佔用率閾值調整</h5>
                <div id="occupancyThresholds">
                  <!-- 動態生成佔用率閾值 -->
                </div>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-info"
                  onclick="addOccupancyThreshold()"
                >
                  <i class="fas fa-plus"></i> 新增閾值
                </button>
              </div>
              <div class="col-md-6">
                <h5>事件調整倍數</h5>
                <div id="eventMultipliers">
                  <!-- 動態生成事件調整 -->
                </div>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-info"
                  onclick="addEventMultiplier()"
                >
                  <i class="fas fa-plus"></i> 新增事件
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 提交按鈕 -->
        <div class="text-center">
          <button
            type="button"
            class="btn btn-primary btn-lg"
            onclick="saveConfiguration()"
          >
            <i class="fas fa-save"></i> 儲存配置
          </button>
          <button
            type="button"
            class="btn btn-secondary btn-lg ml-3"
            onclick="previewConfiguration()"
          >
            <i class="fas fa-eye"></i> 預覽配置
          </button>
          <button
            type="button"
            class="btn btn-success btn-lg ml-3"
            onclick="testConfiguration()"
          >
            <i class="fas fa-test-tube"></i> 測試配置
          </button>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // 全局變量
      let selectedPricingModel = null;
      let vehicleTypeCounter = 0;
      let monthlyPlanCounter = 0;
      let discountRuleCounter = 0;
      let occupancyThresholdCounter = 0;
      let eventMultiplierCounter = 0;

      // 初始化
      document.addEventListener("DOMContentLoaded", function () {
        initializePricingModelSelection();
        initializeDynamicPricing();
        loadDefaultVehicleTypes();
        loadDefaultDiscountRules();
      });

      // 計費模式選擇
      function initializePricingModelSelection() {
        const pricingCards = document.querySelectorAll(".pricing-model-card");
        pricingCards.forEach((card) => {
          card.addEventListener("click", function () {
            pricingCards.forEach((c) => c.classList.remove("selected"));
            this.classList.add("selected");
            selectedPricingModel = this.dataset.model;
            updateDynamicConfigSections();
          });
        });
      }

      // 更新動態配置區域
      function updateDynamicConfigSections() {
        const dynamicSection = document.getElementById("dynamicConfigSections");
        dynamicSection.innerHTML = "";

        switch (selectedPricingModel) {
          case "unified_flat_rate":
            dynamicSection.innerHTML = createUnifiedRateConfig();
            break;
          case "day_night_rates":
            dynamicSection.innerHTML = createDayNightRateConfig();
            break;
          case "multi_segment_rates":
            dynamicSection.innerHTML = createMultiSegmentRateConfig();
            break;
          case "weekday_holiday_rates":
            dynamicSection.innerHTML = createWeekdayHolidayRateConfig();
            break;
          case "weekday_holiday_festival_rates":
            dynamicSection.innerHTML = createWeekdayHolidayFestivalRateConfig();
            break;
          case "per_entry_rate":
            dynamicSection.innerHTML = createPerEntryRateConfig();
            break;
        }
      }

      // 配置模板生成函數
      function createUnifiedRateConfig() {
        return `
                <div class="config-section">
                    <h3 class="section-title">全天統一費率配置</h3>
                    <div class="row">
                        <div class="col-md-4">
                            <label>汽車費率 (元/小時)</label>
                            <input type="number" class="form-control" id="unifiedCarRate" value="40">
                        </div>
                        <div class="col-md-4">
                            <label>機車費率 (元/小時)</label>
                            <input type="number" class="form-control" id="unifiedMotorcycleRate" value="10">
                        </div>
                        <div class="col-md-4">
                            <label>每日最高上限 (元)</label>
                            <input type="number" class="form-control" id="unifiedDailyCap" value="300">
                        </div>
                    </div>
                </div>
            `;
      }

      function createDayNightRateConfig() {
        return `
                <div class="config-section">
                    <h3 class="section-title">日間夜間費率配置</h3>
                    <div class="row">
                        <div class="col-md-6">
                            <h5>日間時段 (07:00-22:00)</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <label>汽車費率 (元/小時)</label>
                                    <input type="number" class="form-control" id="dayCarRate" value="50">
                                </div>
                                <div class="col-md-6">
                                    <label>機車費率 (元/小時)</label>
                                    <input type="number" class="form-control" id="dayMotorcycleRate" value="15">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h5>夜間時段 (22:00-07:00)</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <label>汽車費率 (元/小時)</label>
                                    <input type="number" class="form-control" id="nightCarRate" value="20">
                                </div>
                                <div class="col-md-6">
                                    <label>機車費率 (元/小時)</label>
                                    <input type="number" class="form-control" id="nightMotorcycleRate" value="8">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
      }

      // 其他配置模板函數...
      function createMultiSegmentRateConfig() {
        return `
                <div class="config-section">
                    <h3 class="section-title">多段式費率配置</h3>
                    <div id="timeSlots">
                        <!-- 動態生成時段配置 -->
                    </div>
                    <button type="button" class="btn btn-outline-primary" onclick="addTimeSlot()">
                        <i class="fas fa-plus"></i> 新增時段
                    </button>
                </div>
            `;
      }

      // 載入預設車輛類型
      function loadDefaultVehicleTypes() {
        const vehicleTypes = [
          { type: "car", label: "汽車", multiplier: 1.0 },
          { type: "motorcycle", label: "機車", multiplier: 0.4 },
          { type: "large_vehicle", label: "大型車", multiplier: 1.8 },
          { type: "electric_vehicle", label: "電動車", multiplier: 0.7 },
          { type: "bicycle", label: "自行車", multiplier: 0.1 },
        ];

        vehicleTypes.forEach((vehicle) => {
          addVehicleTypeConfig(vehicle);
        });
      }

      // 新增車輛類型配置
      function addVehicleTypeConfig(preset = null) {
        const container = document.getElementById("vehicleTypeConfigs");
        const id = vehicleTypeCounter++;

        const vehicleConfig = document.createElement("div");
        vehicleConfig.className = "vehicle-config-item";
        vehicleConfig.innerHTML = `
                <div class="row">
                    <div class="col-md-3">
                        <label>車輛類型</label>
                        <select class="form-control" name="vehicleType_${id}">
                            <option value="car" ${
                              preset && preset.type === "car" ? "selected" : ""
                            }>汽車</option>
                            <option value="motorcycle" ${
                              preset && preset.type === "motorcycle"
                                ? "selected"
                                : ""
                            }>機車</option>
                            <option value="large_vehicle" ${
                              preset && preset.type === "large_vehicle"
                                ? "selected"
                                : ""
                            }>大型車</option>
                            <option value="electric_vehicle" ${
                              preset && preset.type === "electric_vehicle"
                                ? "selected"
                                : ""
                            }>電動車</option>
                            <option value="bicycle" ${
                              preset && preset.type === "bicycle"
                                ? "selected"
                                : ""
                            }>自行車</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label>費率倍數</label>
                        <input type="number" class="form-control" name="rateMultiplier_${id}" value="${
          preset ? preset.multiplier : 1.0
        }" step="0.1">
                    </div>
                    <div class="col-md-2">
                        <label>每日上限倍數</label>
                        <input type="number" class="form-control" name="capMultiplier_${id}" value="1.0" step="0.1">
                    </div>
                    <div class="col-md-2">
                        <label>寬限期倍數</label>
                        <input type="number" class="form-control" name="graceMultiplier_${id}" value="1.0" step="0.1">
                    </div>
                    <div class="col-md-2">
                        <label>適用優惠</label>
                        <select class="form-control" name="applicableDiscounts_${id}" multiple>
                            <option value="resident">里民優惠</option>
                            <option value="disabled">身心障礙優惠</option>
                            <option value="consumption">消費折抵</option>
                            <option value="credit_card">信用卡優惠</option>
                            <option value="member">會員優惠</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label>&nbsp;</label>
                        <button type="button" class="btn btn-danger btn-sm d-block" onclick="this.parentElement.parentElement.parentElement.remove()">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        container.appendChild(vehicleConfig);
      }

      // 載入預設優惠規則
      function loadDefaultDiscountRules() {
        const defaultDiscounts = [
          { id: "resident", name: "里民優惠", type: "percentage", value: 0.2 },
          {
            id: "disabled",
            name: "身心障礙優惠",
            type: "free_hours",
            value: 4,
          },
          { id: "consumption", name: "消費折抵", type: "free_hours", value: 1 },
          {
            id: "credit_card",
            name: "信用卡優惠",
            type: "percentage",
            value: 0.1,
          },
          {
            id: "mobile_payment",
            name: "行動支付優惠",
            type: "free_hours",
            value: 2,
          },
        ];

        defaultDiscounts.forEach((discount) => {
          addDiscountRule(discount);
        });
      }

      // 新增優惠規則
      function addDiscountRule(preset = null) {
        const container = document.getElementById("discountRules");
        const id = discountRuleCounter++;

        const discountRule = document.createElement("div");
        discountRule.className = "discount-rule-item";
        discountRule.innerHTML = `
                <div class="row">
                    <div class="col-md-3">
                        <label>優惠名稱</label>
                        <input type="text" class="form-control" name="discountName_${id}" value="${
          preset ? preset.name : ""
        }">
                    </div>
                    <div class="col-md-2">
                        <label>優惠類型</label>
                        <select class="form-control" name="discountType_${id}">
                            <option value="percentage" ${
                              preset && preset.type === "percentage"
                                ? "selected"
                                : ""
                            }>百分比折扣</option>
                            <option value="fixed_amount" ${
                              preset && preset.type === "fixed_amount"
                                ? "selected"
                                : ""
                            }>固定金額減免</option>
                            <option value="free_hours" ${
                              preset && preset.type === "free_hours"
                                ? "selected"
                                : ""
                            }>免費時數</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label>優惠值</label>
                        <input type="number" class="form-control" name="discountValue_${id}" value="${
          preset ? preset.value : 0
        }" step="0.1">
                    </div>
                    <div class="col-md-2">
                        <label>每日限制</label>
                        <input type="number" class="form-control" name="dailyLimit_${id}" value="1">
                    </div>
                    <div class="col-md-2">
                        <label>優先級</label>
                        <input type="number" class="form-control" name="priority_${id}" value="5">
                    </div>
                    <div class="col-md-1">
                        <label>&nbsp;</label>
                        <button type="button" class="btn btn-danger btn-sm d-block" onclick="this.parentElement.parentElement.parentElement.remove()">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        container.appendChild(discountRule);
      }

      // 動態定價初始化
      function initializeDynamicPricing() {
        const checkbox = document.getElementById("enableDynamicPricing");
        const config = document.getElementById("dynamicPricingConfig");

        checkbox.addEventListener("change", function () {
          config.style.display = this.checked ? "block" : "none";
        });
      }

      // 儲存配置
      function saveConfiguration() {
        const formData = collectFormData();
        console.log("配置數據:", formData);
        alert("配置已儲存！");
      }

      // 預覽配置
      function previewConfiguration() {
        const formData = collectFormData();
        const previewWindow = window.open("", "_blank");
        previewWindow.document.write(`
                <html>
                <head><title>配置預覽</title></head>
                <body>
                    <h1>停車場費率配置預覽</h1>
                    <pre>${JSON.stringify(formData, null, 2)}</pre>
                </body>
                </html>
            `);
      }

      // 測試配置
      function testConfiguration() {
        const formData = collectFormData();
        // 實現測試邏輯
        alert("配置測試功能待實現");
      }

      // 收集表單數據
      function collectFormData() {
        // 實現完整的表單數據收集邏輯
        return {
          parking_lot_info: {
            lot_name: document.getElementById("lotName").value,
            lot_type: document.getElementById("lotType").value,
            operating_hours: document.getElementById("operatingHours").value,
            min_billing_unit: parseInt(
              document.getElementById("minBillingUnit").value
