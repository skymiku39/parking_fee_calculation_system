<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}智能停車系統{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    {% block head %}{% endblock %}
    <style>
      body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: #f4f6f8;
      }

      .app-shell {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 240px;
        background: linear-gradient(180deg, #4b6cb7 0%, #182848 100%);
        color: white;
        display: flex;
        flex-direction: column;
      }

      .sidebar .brand {
        padding: 18px 20px;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .sidebar a.nav-link {
        color: rgba(255, 255, 255, 0.9);
        padding: 12px 16px;
        border-radius: 6px;
        margin: 6px 12px;
      }

      .sidebar a.nav-link:hover,
      .sidebar a.nav-link.active {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }

      .sidebar .footer {
        margin-top: auto;
        padding: 12px;
        font-size: 12px;
        opacity: 0.8;
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        background: white;
        border-bottom: 1px solid #e9ecef;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .content {
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <i class="fas fa-parking"></i>
          <span>智能停車系統</span>
        </div>
        <nav class="mt-2">
          <a class="nav-link" href="/"><i class="fas fa-gauge me-2"></i> 控制台</a>
          <a class="nav-link" href="/plan_manager"><i class="fas fa-folder-tree me-2"></i> 方案管理</a>
          <a class="nav-link" href="/rate_plan_designer"><i class="fas fa-drafting-compass me-2"></i> 方案設計器</a>
          <a class="nav-link" href="/calendar_manager"><i class="fas fa-calendar-alt me-2"></i> 日曆與假日</a>
          <a class="nav-link" href="/settlement_center"><i class="fas fa-calculator me-2"></i> 結算中心</a>
          <a class="nav-link" href="/system_settings"><i class="fas fa-gear me-2"></i> 系統設定</a>
        </nav>
        <div class="footer">
          <div><i class="fas fa-code-branch"></i> v1.0.0</div>
        </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <h5 class="mb-0">{% block page_title %}{% endblock %}</h5>
          <div>{% block toolbar %}{% endblock %}</div>
        </div>
        <div class="content">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
  </html>
