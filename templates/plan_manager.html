{% extends "layout/base.html" %}
{% block title %}方案管理 - 智能停車系統{% endblock %}
{% block page_title %}<i class="fas fa-folder-tree me-2"></i> 方案管理{% endblock %}

{% block toolbar %}
<div class="input-group" style="width: 360px;">
  <span class="input-group-text"><i class="fas fa-search"></i></span>
  <input id="planSearch" type="text" class="form-control" placeholder="搜尋方案名稱或描述" />
  <button class="btn btn-primary" onclick="openCreatePlan()"><i class="fas fa-plus"></i> 新增方案</button>
  <a class="btn btn-outline-secondary" href="/rate_plan_designer"><i class="fas fa-drafting-compass"></i> 設計器</a>
  <a class="btn btn-outline-secondary" href="/"><i class="fas fa-gauge"></i> 控制台</a>
  <a class="btn btn-outline-secondary" href="/system_settings"><i class="fas fa-gear"></i> 設定</a>
  <a class="btn btn-outline-secondary" href="/calendar_manager"><i class="fas fa-calendar-alt"></i> 日曆</a>
  <a class="btn btn-outline-secondary" href="/settlement_center"><i class="fas fa-calculator"></i> 結算</a>
</div>
{% endblock %}

{% block content %}
<div class="container"><div class="row g-3">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <strong><i class="fas fa-list me-2"></i> 用戶方案</strong>
        <small id="plansCount" class="text-muted"></small>
      </div>
      <div class="card-body p-0">
        <div id="plansList" class="list-group list-group-flush"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card mb-3">
      <div class="card-header"><strong><i class="fas fa-eye me-2"></i> 方案預覽</strong></div>
      <div class="card-body" id="previewPanel">
        <div class="text-muted">請從左側選擇一個方案以查看詳情</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><strong><i class="fas fa-bolt me-2"></i> 快速操作</strong></div>
      <div class="card-body d-grid gap-2">
        <!-- 本地計算機模式：移除啟用方案 -->
        <button class="btn btn-outline-danger" id="deleteBtn" disabled onclick="deleteSelected()">
          <i class="fas fa-trash"></i> 刪除選擇的方案
        </button>
        <a class="btn btn-outline-primary" href="/rate_plan_designer">
          <i class="fas fa-pen"></i> 用設計器編輯/新建
        </a>
      </div>
    </div>
  </div>
</div></div>

<!-- 簡易通知 -->
<div id="toast" class="toast align-items-center text-white bg-dark position-fixed bottom-0 end-0 m-3" role="alert" aria-live="assertive" aria-atomic="true" style="z-index: 1080;">
  <div class="d-flex">
    <div class="toast-body" id="toastBody">操作結果</div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  let allPlans = [];
  let selectedPlanId = null;

  document.addEventListener('DOMContentLoaded', () => {
    loadPlans();
    document.getElementById('planSearch').addEventListener('input', filterPlans);
  });

  function showToast(message) {
    const el = document.getElementById('toast');
    document.getElementById('toastBody').textContent = message;
    const t = new bootstrap.Toast(el, { delay: 2200 });
    t.show();
  }

  function loadPlans() {
    fetch('/api/rate_plans/list')
      .then(r => r.json())
      .then(data => {
        if (!data.success) { showToast('載入方案失敗'); return; }
        allPlans = data.plans || [];
        renderPlans(allPlans);
        document.getElementById('plansCount').textContent = `共 ${allPlans.length} 個`;
      })
      .catch(() => showToast('網路錯誤'));
  }

  function filterPlans(e) {
    const q = (e.target.value || '').toLowerCase();
    const filtered = allPlans.filter(p => {
      return (p.name || '').toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q);
    });
    renderPlans(filtered);
  }

  function renderPlans(plans) {
    const list = document.getElementById('plansList');
    list.innerHTML = '';
    if (!plans.length) {
      list.innerHTML = '<div class="list-group-item text-muted">沒有符合條件的方案</div>';
      return;
    }
    plans.forEach(p => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
      item.innerHTML = `
        <div>
          <div class="fw-bold">${p.name}</div>
          <small class="text-muted">${p.segment_type} · ${p.holiday_type} · ${p.segments_count} 段 ${p.has_rate_matrix ? '· 已設定費率' : ''}</small>
        </div>
        <i class="fas fa-chevron-right text-muted"></i>
      `;
      item.onclick = () => onSelectPlan(p.plan_id);
      list.appendChild(item);
    });
  }

  function onSelectPlan(planId) {
    selectedPlanId = planId;
    // 本地計算機模式：無啟用
    document.getElementById('deleteBtn').disabled = false;
    fetch(`/api/rate_plans/load/${planId}`)
      .then(r => r.json())
      .then(data => {
        if (!data.success) { showToast('載入詳情失敗'); return; }
        renderPreview(data.plan);
      })
      .catch(() => showToast('網路錯誤'));
  }

  function renderPreview(plan) {
    const el = document.getElementById('previewPanel');
    const segs = plan.segments || [];
    const caps = plan.global_caps || {};
    el.innerHTML = `
      <div class="mb-2"><strong>名稱：</strong>${plan.name}</div>
      <div class="mb-2"><strong>類型：</strong>${plan.segment_type} · ${plan.holiday_type}</div>
      ${caps.daily_cap_enabled ? `<div class="mb-2"><strong>日上限：</strong>${caps.daily_cap_amount} 元</div>` : ''}
      <div class="mb-2"><strong>時段：</strong></div>
      <div class="small">
        ${segs.map(s => `<div class="border rounded px-2 py-1 mb-1">${s.name}（${s.start}-${s.end}）</div>`).join('')}
      </div>
    `;
  }

  // 本地計算機模式：無啟用

  function deleteSelected() {
    if (!selectedPlanId) return;
    if (!confirm('確定要刪除這個方案嗎？')) return;
    fetch(`/api/rate_plans/${selectedPlanId}`, { method: 'DELETE' })
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          showToast('刪除成功');
          selectedPlanId = null;
          document.getElementById('activateBtn').disabled = true;
          document.getElementById('deleteBtn').disabled = true;
          document.getElementById('previewPanel').innerHTML = '<div class="text-muted">請從左側選擇一個方案以查看詳情</div>';
          loadPlans();
        } else {
          showToast(d.error || '刪除失敗');
        }
      })
      .catch(() => showToast('網路錯誤'));
  }

  function openCreatePlan() {
    window.location.href = '/rate_plan_designer';
  }
</script>
{% endblock %}
