{% extends "layout/base.html" %}
{% block title %}方案設計器 - 智能停車系統{% endblock %}
{% block page_title %}<i class="fas fa-drafting-compass me-2"></i> 方案設計器{% endblock %}
{% block content %}
  <div class="container-fluid py-3">
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card">
          <div class="card-header">基本資訊</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">範本 ID</label>
              <input id="template_id" type="text" class="form-control" placeholder="例：二段_平日假日" />
              <small class="text-muted">唯一識別；英數與底線，避免空白</small>
            </div>
            <div class="mb-3">
              <label class="form-label">名稱</label>
              <input id="label" type="text" class="form-control" placeholder="顯示名稱" />
            </div>
            <div class="mb-3">
              <label class="form-label">描述</label>
              <textarea id="description" class="form-control" rows="2" placeholder="說明（選填）"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">時段類型</label>
              <select id="time_segment_type" class="form-select">
                <option value="全天">全天</option>
                <option value="兩段">兩段</option>
                <option value="三段">三段</option>
                <option value="四段">四段</option>
                <option value="自訂">自訂</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">假日類型</label>
              <select id="holiday_type" class="form-select">
                <option value="無假日費率">無假日費率</option>
                <option value="六日費率">六日費率</option>
                <option value="國定假費率">國定假費率</option>
              </select>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" onclick="saveTemplate()"><i class="fas fa-save"></i> 儲存</button>
              <button class="btn btn-outline-secondary" onclick="downloadTemplate()"><i class="fas fa-download"></i> 匯出</button>
              <button class="btn btn-outline-danger" onclick="delTemplate()"><i class="fas fa-trash"></i> 刪除</button>
            </div>
            <div id="msg" class="mt-2 small"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header">時間時段與費率</div>
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div class="form-text">請輸入此範本的 time_slots（簡化：一次編輯一個日期類別，套用於該假日類型）</div>
              <button class="btn btn-sm btn-outline-primary" onclick="addSlot()"><i class="fas fa-plus"></i> 新增時段</button>
            </div>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>標籤</th>
                    <th>開始</th>
                    <th>結束</th>
                    <th>單位(分)</th>
                    <th>單價(元)</th>
                    <th>免費(分)</th>
                    <th>上限</th>
                    <th>累進</th>
                    <th style="width:90px;"></th>
                  </tr>
                </thead>
                <tbody id="slotBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
{% block scripts %}
<script>
  let current = { template_id:'', label:'', description:'', time_segment_type:'兩段', holiday_type:'六日費率', time_slots:[], daily_cap_enabled:false, daily_cap_amount:0, global_grace_time:0 };

  document.addEventListener('DOMContentLoaded', async () => {
    const url = new URL(window.location.href);
    const tid = url.searchParams.get('template_id');
    if (tid) { await loadTemplate(tid); }
    bindForm();
    renderSlots();
  });

  function bindForm(){
    document.getElementById('template_id').value = current.template_id || '';
    document.getElementById('label').value = current.label || '';
    document.getElementById('description').value = current.description || '';
    document.getElementById('time_segment_type').value = current.time_segment_type || '兩段';
    document.getElementById('holiday_type').value = current.holiday_type || '六日費率';
  }

  async function loadTemplate(id){
    try{
      const resp = await fetch(`/api/mdp/templates/${encodeURIComponent(id)}`);
      const data = await resp.json();
      if(!data.success) return showMsg('danger', '載入失敗：' + (data.message||data.error||'未知錯誤'));
      current = data.template || current;
    }catch(e){
      showMsg('danger', '載入失敗：' + (e.message||e));
    }
    bindForm();
    renderSlots();
  }

  function renderSlots(){
    const body = document.getElementById('slotBody');
    body.innerHTML = '';
    (current.time_slots||[]).forEach((s, idx) => body.appendChild(rowForSlot(s, idx)));
    if (!(current.time_slots&&current.time_slots.length)) body.innerHTML = '<tr><td colspan="9" class="text-muted">尚無時段，請新增</td></tr>';
  }

  function rowForSlot(s, idx){
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input class="form-control form-control-sm" value="${escapeHtml(s.label||'')}" oninput="slotSet(${idx},'label',this.value)"/></td>
      <td><input class="form-control form-control-sm" value="${escapeHtml(s.start||'08:00')}" oninput="slotSet(${idx},'start',this.value)"/></td>
      <td><input class="form-control form-control-sm" value="${escapeHtml(s.end||'22:00')}" oninput="slotSet(${idx},'end',this.value)"/></td>
      <td style="width:110px"><input type="number" class="form-control form-control-sm" value="${Number(s.unit_minutes||60)}" oninput="slotSet(${idx},'unit_minutes',parseInt(this.value)||60)"/></td>
      <td style="width:110px"><input type="number" class="form-control form-control-sm" value="${Number(s.default_unit_price||0)}" oninput="slotSet(${idx},'default_unit_price',parseInt(this.value)||0)"/></td>
      <td style="width:110px"><input type="number" class="form-control form-control-sm" value="${Number(s.grace_minutes||0)}" oninput="slotSet(${idx},'grace_minutes',parseInt(this.value)||0)"/></td>
      <td style="width:110px">
        <div class="input-group input-group-sm">
          <span class="input-group-text">上限</span>
          <input type="number" class="form-control" value="${Number(s.cap_amount||0)}" oninput="slotSet(${idx},'cap_amount',parseInt(this.value)||0)">
          <span class="input-group-text"><input type="checkbox" ${s.cap_enabled? 'checked':''} onclick="slotSet(${idx},'cap_enabled',this.checked)"></span>
        </div>
      </td>
      <td style="width:90px; text-align:center"><input type="checkbox" ${s.progressive_enabled? 'checked':''} onclick="slotSet(${idx},'progressive_enabled',this.checked)"/></td>
      <td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="removeSlot(${idx})"><i class="fas fa-times"></i></button></td>
    `;
    return tr;
  }

  function slotSet(idx, key, val){
    current.time_slots[idx] = { ...(current.time_slots[idx]||{}), [key]: val };
  }
  function removeSlot(idx){
    current.time_slots.splice(idx,1); renderSlots();
  }
  function addSlot(){
    if(!current.time_slots) current.time_slots = [];
    current.time_slots.push({label:'日間', start:'08:00', end:'22:00', unit_minutes:30, default_unit_price:30, grace_minutes:0, cap_enabled:false, cap_amount:0, progressive_enabled:false, progressive_rates:[]});
    renderSlots();
  }

  async function saveTemplate(){
    const payload = collectTemplate();
    try{
      const resp = await fetch('/api/mdp/templates/save',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({template:payload})});
      const data = await resp.json();
      if(data.success){
        showMsg('success', `✅ 已儲存：${payload.label||payload.template_id}`);
      }else{
        showMsg('danger', '❌ 儲存失敗：' + (data.message||data.error||'未知錯誤'));
      }
    }catch(e){
      showMsg('danger', '❌ 儲存失敗：' + (e.message||e));
    }
  }

  function collectTemplate(){
    const tpl_id = (document.getElementById('template_id').value||'').trim();
    const label = (document.getElementById('label').value||'').trim();
    const desc = (document.getElementById('description').value||'').trim();
    const tseg = document.getElementById('time_segment_type').value;
    const htyp = document.getElementById('holiday_type').value;
    return {
      template_id: tpl_id || label.replace(/\s+/g,'_') || 'template_'+Date.now(),
      label: label || tpl_id,
      description: desc,
      time_segment_type: tseg,
      holiday_type: htyp,
      time_slots: current.time_slots||[],
      daily_cap_enabled: !!current.daily_cap_enabled,
      daily_cap_amount: Number(current.daily_cap_amount||0),
      global_grace_time: Number(current.global_grace_time||0),
    };
  }

  async function downloadTemplate(){
    const id = (document.getElementById('template_id').value||'').trim();
    if(!id){ return showMsg('danger','請先填寫範本 ID 後再匯出'); }
    try{
      const resp = await fetch(`/api/mdp/templates/${encodeURIComponent(id)}`);
      const data = await resp.json();
      if(!data.success) return showMsg('danger','下載失敗：' + (data.message||data.error||'未知錯誤'));
      const tpl = data.template || collectTemplate();
      const fname = (tpl.label || tpl.template_id || 'template') + '.json';
      const blob = new Blob([JSON.stringify(tpl, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }catch(e){
      showMsg('danger','下載失敗：' + (e.message||e));
    }
  }

  async function delTemplate(){
    const id = (document.getElementById('template_id').value||'').trim();
    if(!id) return showMsg('danger','請先輸入範本 ID');
    if(!confirm(`確定刪除範本「${id}」？`)) return;
    try{
      const resp = await fetch(`/api/mdp/templates/${encodeURIComponent(id)}`, {method:'DELETE'});
      const data = await resp.json();
      if(data.success){
        showMsg('success', '已刪除');
        current = { template_id:'', label:'', description:'', time_segment_type:'兩段', holiday_type:'六日費率', time_slots:[] };
        bindForm(); renderSlots();
      }else{
        showMsg('danger', '刪除失敗：' + (data.message||data.error||'未知錯誤'));
      }
    }catch(e){
      showMsg('danger', '刪除失敗：' + (e.message||e));
    }
  }

  function showMsg(type, text){
    const el = document.getElementById('msg');
    el.className = `mt-2 small text-${type==='success'?'success':'danger'}`;
    el.textContent = text;
    setTimeout(()=>{ el.textContent=''; }, 3000);
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
</script>
{% endblock %}
