{% extends "layout/base.html" %}
{% block title %}方案設計器 - 智能停車系統{% endblock %}
{% block page_title %}<i class="fas fa-drafting-compass me-2"></i> 方案設計器{% endblock %}
{% block content %}
  <div class="container-fluid py-3">
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card">
          <div class="card-header">基本資訊</div>
          <div class="card-body">
            <div class="mb-2">
              <label class="form-label">範本 ID</label>
              <input id="template_id" type="text" class="form-control" placeholder="例：二段_平日假日" />
            </div>
            <div class="mb-2">
              <label class="form-label">名稱</label>
              <input id="label" type="text" class="form-control" placeholder="顯示名稱" />
            </div>
            <div class="mb-2">
              <label class="form-label">描述</label>
              <textarea id="description" class="form-control" rows="2" placeholder="說明（選填）"></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label">時段類型</label>
              <select id="time_segment_type" class="form-select" onchange="onTypeChange()">
                <option value="一段">一段</option>
                <option value="兩段" selected>兩段</option>
                <option value="三段">三段</option>
                <option value="四段">四段</option>
                <option value="自訂">自訂</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">假日類型</label>
              <select id="holiday_type" class="form-select" onchange="renderMatrix()">
                <option value="六日費率">六日費率（平日/週末）</option>
                <option value="國定假費率">國定假費率（平日/週末/國定）</option>
                <option value="無假日費率">無假日（統一）</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">全域免費(分)</label>
              <input id="global_grace" type="number" class="form-control" value="0" />
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" onclick="saveTemplate()"><i class="fas fa-save"></i> 儲存</button>
              <button class="btn btn-outline-secondary" onclick="downloadTemplate()"><i class="fas fa-download"></i> 匯出</button>
              <button class="btn btn-outline-info" onclick="triggerImport()"><i class="fas fa-file-import"></i> 匯入</button>
              <button class="btn btn-outline-danger" onclick="delTemplate()"><i class="fas fa-trash"></i> 刪除</button>
              <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importTemplateFromFile(event)" />
            </div>
            <div id="msg" class="mt-2 small"></div>
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span>時間區段</span>
            <button class="btn btn-sm btn-outline-primary" onclick="addSegment()"><i class="fas fa-plus"></i> 新增</button>
          </div>
          <div class="card-body p-0">
            <table class="table table-sm mb-0">
              <thead>
                <tr><th>名稱</th><th>開始</th><th>結束</th><th style="width:60px"></th></tr>
              </thead>
              <tbody id="segBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card">
          <div class="card-header">費率組合矩陣</div>
          <div class="card-body">
            <div id="matrixHost" class="table-responsive"></div>
            <hr/>
            <div class="row g-2 align-items-end">
              <div class="col-md-4">
                <label class="form-label">進場</label>
                <input id="preview_enter" type="datetime-local" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label">出場</label>
                <input id="preview_exit" type="datetime-local" class="form-control" />
              </div>
              <div class="col-md-4 d-grid d-md-block">
                <button class="btn btn-warning w-100" onclick="previewInline()"><i class="fas fa-bolt"></i> 即時試算</button>
              </div>
            </div>
            <div id="previewBox" class="alert mt-3" style="display:none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
{% block scripts %}
<script>
  // 內部狀態
  let segments = [ {name:'日間', start:'08:00', end:'22:00'}, {name:'夜間', start:'22:00', end:'08:00'} ];
  let matrix = {}; // key: `${seg}_${cat}` -> {unit, rate, grace, capEnabled, capAmount}

  document.addEventListener('DOMContentLoaded', async () => {
    const url = new URL(window.location.href);
    const tid = url.searchParams.get('template_id');
    if (tid) await loadTemplate(tid);
    bindForm();
    renderSegments();
    renderMatrix();
  });

  function currentCategories(){
    const ht = document.getElementById('holiday_type').value;
    if (ht === '無假日費率') return ['統一'];
    if (ht === '國定假費率') return ['平日','週末','國定假日'];
    return ['平日','週末'];
  }

  function bindForm(){ /* 填基本欄位，留空即可 */ }

  async function loadTemplate(id){
    try{
      const resp = await fetch(`/api/mdp/templates/${encodeURIComponent(id)}`);
      const data = await resp.json();
      if(!data.success) return showMsg('danger','載入失敗：' + (data.message||data.error||'未知錯誤'));
      const tpl = data.template || {};
      populateFromTemplateObject(tpl);
    }catch(e){ showMsg('danger','載入失敗：' + (e.message||e)); }
  }

  function renderSegments(){
    const body = document.getElementById('segBody');
    body.innerHTML = '';
    segments.forEach((s, i)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="form-control form-control-sm" value="${escapeHtml(s.name)}" oninput="segEdit(${i},'name',this.value)"/></td>
        <td><input class="form-control form-control-sm" value="${escapeHtml(s.start)}" oninput="segEdit(${i},'start',this.value)"/></td>
        <td><input class="form-control form-control-sm" value="${escapeHtml(s.end)}" oninput="segEdit(${i},'end',this.value)"/></td>
        <td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="segRemove(${i})"><i class="fas fa-times"></i></button></td>`;
      body.appendChild(tr);
    });
  }
  function segEdit(i,k,v){ segments[i] = {...segments[i],[k]:v}; renderMatrix(); }
  function segRemove(i){ segments.splice(i,1); renderSegments(); renderMatrix(); }
  function addSegment(){ segments.push({name:'新時段', start:'09:00', end:'18:00'}); renderSegments(); renderMatrix(); }

  function onTypeChange(){
    const t = document.getElementById('time_segment_type').value;
    if (t === '一段') {
      segments = [{name:'全天', start:'00:00', end:'24:00'}];
    } else if (t === '兩段') {
      segments = [{name:'日間', start:'08:00', end:'22:00'},{name:'夜間', start:'22:00', end:'08:00'}];
    } else if (t === '三段') {
      segments = [
        {name:'早間', start:'07:00', end:'12:00'},
        {name:'日間', start:'12:00', end:'20:00'},
        {name:'夜間', start:'20:00', end:'07:00'}
      ];
    } else if (t === '四段') {
      segments = [
        {name:'凌晨', start:'00:00', end:'06:00'},
        {name:'上午', start:'06:00', end:'12:00'},
        {name:'午後', start:'12:00', end:'18:00'},
        {name:'晚間', start:'18:00', end:'24:00'}
      ];
    } else {
      // 自訂: 不變
    }
    renderSegments();
    renderMatrix();
  }

  function renderMatrix(){
    const cats = currentCategories();
    const host = document.getElementById('matrixHost');
    let html = '<table class="table table-bordered table-sm align-middle"><thead><tr><th>日期類別 \\ 時段</th>';
    segments.forEach(seg=>{ html += `<th>${escapeHtml(seg.name)}<br/><small>${escapeHtml(seg.start)}-${escapeHtml(seg.end)}</small></th>`; });
    html += '</tr></thead><tbody>';
    cats.forEach(cat=>{
      html += `<tr><th style="white-space:nowrap">${cat}</th>`;
      segments.forEach(seg=>{
        const key = `${seg.name}_${cat}`;
        const cell = matrix[key] || {unit:60, rate:0, grace:0, capEnabled:false, capAmount:0};
        html += `<td>
          <div class="row gx-1 gy-1">
            <div class="col-6"><input class="form-control form-control-sm" type="number" min="1" value="${cell.unit}" onchange="setCell('${escapeAttr(key)}','unit',this.value)"><small class="text-muted">單位(分)</small></div>
            <div class="col-6"><input class="form-control form-control-sm" type="number" min="0" value="${cell.rate}" onchange="setCell('${escapeAttr(key)}','rate',this.value)"><small class="text-muted">單價(元)</small></div>
            <div class="col-6"><input class="form-control form-control-sm" type="number" min="0" value="${cell.grace}" onchange="setCell('${escapeAttr(key)}','grace',this.value)"><small class="text-muted">免費(分)</small></div>
            <div class="col-6"><div class="input-group input-group-sm"><span class="input-group-text">上限</span><input class="form-control" type="number" min="0" value="${cell.capAmount}" onchange="setCell('${escapeAttr(key)}','capAmount',this.value)"><span class="input-group-text"><input type="checkbox" ${cell.capEnabled?'checked':''} onclick="setCell('${escapeAttr(key)}','capEnabled',this.checked)"></span></div></div>
          </div>
        </td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    host.innerHTML = html;
  }
  function setCell(key, field, val){
    const cur = matrix[key] || {unit:60, rate:0, grace:0, capEnabled:false, capAmount:0};
    if (field==='unit' || field==='rate' || field==='grace' || field==='capAmount') val = parseInt(val)||0;
    matrix[key] = {...cur, [field]: val};
  }

  function populateFromTemplateObject(tpl){
    document.getElementById('template_id').value = tpl.template_id||'';
    document.getElementById('label').value = tpl.label||'';
    document.getElementById('description').value = tpl.description||'';
    document.getElementById('time_segment_type').value = tpl.time_segment_type||'兩段';
    document.getElementById('holiday_type').value = tpl.holiday_type||'六日費率';
    document.getElementById('global_grace').value = (tpl.weekday_plan?.global_grace_time) || (tpl.unified_plan?.global_grace_time) || 0;

    const cats = currentCategories();
    const anyPlan = tpl.weekday_plan || tpl.unified_plan || tpl.weekend_plan || tpl.national_holiday_plan || {};
    segments = (anyPlan.time_slots||[]).map(s=>({name: s.label||s.time_slot_id||'段', start: s.start||'08:00', end: s.end||'22:00'}));
    if (segments.length===0) segments = [ {name:'日間', start:'08:00', end:'22:00'}, {name:'夜間', start:'22:00', end:'08:00'} ];
    matrix = {};
    const planByCat = {
      '統一': tpl.unified_plan,
      '平日': tpl.weekday_plan,
      '週末': tpl.weekend_plan,
      '國定假日': tpl.national_holiday_plan,
    };
    cats.forEach(cat=>{
      const plan = planByCat[cat]||{};
      (plan.time_slots||[]).forEach(s=>{
        matrix[`${s.label||s.time_slot_id}_${cat}`] = {
          unit: Number(s.unit_minutes||60), rate: Number(s.default_unit_price||0), grace: Number(s.grace_minutes||0), capEnabled: !!s.cap_enabled, capAmount: Number(s.cap_amount||0)
        };
      });
    });

    renderSegments();
    renderMatrix();
    showMsg('success', '✅ 範本已載入');
  }

  function triggerImport(){
    const f = document.getElementById('importFile');
    if (f) f.click();
  }

  function importTemplateFromFile(evt){
    try{
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const tpl = JSON.parse(reader.result);
          if (!tpl || typeof tpl !== 'object') return showMsg('danger','匯入失敗：格式不正確');
          populateFromTemplateObject(tpl);
        }catch(e){ showMsg('danger','匯入失敗：' + (e.message||e)); }
      };
      reader.readAsText(file, 'utf-8');
    }finally{
      evt.target.value = '';
    }
  }

  async function previewInline(){
    const enter = document.getElementById('preview_enter').value;
    const exit = document.getElementById('preview_exit').value;
    const box = document.getElementById('previewBox');
    box.style.display = 'none';
    if (!enter || !exit){ box.className='alert alert-warning'; box.textContent='請輸入進出場時間'; box.style.display='block'; return; }
    const payload = { enter_time: enter, exit_time: exit, template: buildTemplate() };
    try{
      const resp = await fetch('/api/mdp/preview', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const data = await resp.json();
      if (!data.success){ box.className='alert alert-danger'; box.textContent = data.message || data.error || '試算失敗'; box.style.display='block'; return; }
      box.className='alert alert-success';
      box.innerHTML = `<strong>成功</strong> 合計：${data.total_amount} 元　時長：${data.total_duration_display || ''}`;
      box.style.display='block';
    }catch(e){ box.className='alert alert-danger'; box.textContent='請求失敗'; box.style.display='block'; }
  }

  // 匯出/儲存：矩陣 -> 多維度模板（各日期類別 plan 的 time_slots）
  function buildTemplate(){
    const tpl_id = (document.getElementById('template_id').value||'').trim();
    const label = (document.getElementById('label').value||'').trim();
    const desc = (document.getElementById('description').value||'').trim();
    const tseg = document.getElementById('time_segment_type').value;
    const htyp = document.getElementById('holiday_type').value;
    const gGrace = parseInt(document.getElementById('global_grace').value)||0;
    const cats = currentCategories();
    const planByCat = {};
    cats.forEach(cat=>{
      const time_slots = segments.map(seg=>{
        const key = `${seg.name}_${cat}`;
        const cell = matrix[key] || {unit:60, rate:0, grace:0, capEnabled:false, capAmount:0};
        return {
          label: seg.name, start: seg.start, end: seg.end,
          unit_minutes: Number(cell.unit||60), default_unit_price: Number(cell.rate||0),
          grace_minutes: Number(cell.grace||0),
          cap_enabled: !!cell.capEnabled, cap_amount: Number(cell.capAmount||0),
          progressive_enabled: false, progressive_rates: []
        };
      });
      planByCat[cat] = { time_slots, global_grace_time: gGrace };
    });
    const tpl = {
      template_id: tpl_id || label.replace(/\s+/g,'_') || 'template_'+Date.now(),
      label: label || tpl_id || '未命名',
      description: desc,
      time_segment_type: tseg,
      holiday_type: htyp,
    };
    if (htyp==='無假日費率') tpl.unified_plan = planByCat['統一'];
    else if (htyp==='國定假費率') { tpl.weekday_plan = planByCat['平日']; tpl.weekend_plan = planByCat['週末']; tpl.national_holiday_plan = planByCat['國定假日']; }
    else { tpl.weekday_plan = planByCat['平日']; tpl.weekend_plan = planByCat['週末']; }
    return tpl;
  }

  async function saveTemplate(){
    try{
      const payload = buildTemplate();
      const resp = await fetch('/api/mdp/templates/save', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({template: payload})});
      const data = await resp.json();
      if (data.success){ showMsg('success', `✅ 已儲存：${payload.label}`); }
      else { showMsg('danger', '❌ 儲存失敗：' + (data.message||data.error||'未知錯誤')); }
    }catch(e){ showMsg('danger', '❌ 儲存失敗：' + (e.message||e)); }
  }

  async function downloadTemplate(){
    const tpl = buildTemplate();
    const fname = (tpl.label || tpl.template_id || 'template') + '.json';
    const blob = new Blob([JSON.stringify(tpl, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  async function delTemplate(){
    const id = (document.getElementById('template_id').value||'').trim();
    if(!id) return showMsg('danger','請先輸入範本 ID');
    if(!confirm(`確定刪除範本「${id}」？`)) return;
    try{
      const resp = await fetch(`/api/mdp/templates/${encodeURIComponent(id)}`, {method:'DELETE'});
      const data = await resp.json();
      if (data.success){ showMsg('success','已刪除'); }
      else showMsg('danger','刪除失敗：' + (data.message||data.error||'未知錯誤'));
    }catch(e){ showMsg('danger','刪除失敗：' + (e.message||e)); }
  }

  function showMsg(type, text){ const el = document.getElementById('msg'); el.className = `mt-2 small text-${type==='success'?'success':'danger'}`; el.textContent = text; setTimeout(()=>{ el.textContent=''; }, 3000); }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
  function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
</script>
{% endblock %}
