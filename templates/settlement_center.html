<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>結算中心 - 智能停車費率計算系統</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .gradient-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .settlement-card {
        border: 2px solid #e9ecef;
        border-radius: 15px;
        transition: all 0.3s ease;
        margin-bottom: 20px;
      }
      .settlement-header {
        background: linear-gradient(45deg, #28a745, #20c997);
        color: white;
        border-radius: 13px 13px 0 0;
        padding: 15px 20px;
      }
      .stats-card {
        background: linear-gradient(45deg, #007bff, #0056b3);
        color: white;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="gradient-header text-center py-4 mb-4">
        <h1><i class="fas fa-calculator"></i> 結算中心</h1>
        <p class="mb-0">停車費用結算、統計分析與財務管理</p>
      </div>

      <div class="row mb-4">
        <div class="col-md-3">
          <div class="stats-card text-center">
            <h3>NT$ 0</h3>
            <p><i class="fas fa-calendar-day"></i> 今日收入</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stats-card text-center">
            <h3>NT$ 0</h3>
            <p><i class="fas fa-calendar-alt"></i> 本月收入</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stats-card text-center">
            <h3>0</h3>
            <p><i class="fas fa-receipt"></i> 交易筆數</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stats-card text-center">
            <h3>NT$ 0</h3>
            <p><i class="fas fa-chart-line"></i> 平均金額</p>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="settlement-card">
            <div class="settlement-header">
              <h4><i class="fas fa-info-circle"></i> 結算中心功能開發中</h4>
            </div>
            <div class="card-body">
              <p>結算中心將提供以下功能：</p>
              <ul>
                <li>即時收入統計</li>
                <li>交易記錄管理</li>
                <li>財務報表生成</li>
                <li>數據分析圖表</li>
              </ul>
              <div class="text-center mt-4">
                <a href="/" class="btn btn-primary">
                  <i class="fas fa-arrow-left"></i> 返回主頁
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
