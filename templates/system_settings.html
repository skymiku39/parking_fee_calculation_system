{% extends "layout/base.html" %}
{% block title %}系統設定 - 智能停車系統{% endblock %}
{% block page_title %}<i class="fas fa-cogs me-2"></i> 系統設定{% endblock %}
{% block head %}
    <style>
      .settings-card {
        border: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 15px;
        margin-bottom: 20px;
        transition: transform 0.2s;
      }
      .settings-card:hover {
        transform: translateY(-2px);
      }
      .settings-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 15px 15px 0 0;
        padding: 20px;
      }
      .nav-pills .nav-link {
        border-radius: 25px;
        margin-right: 10px;
        transition: all 0.3s;
      }
      .nav-pills .nav-link.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .form-switch .form-check-input {
        width: 3em;
        height: 1.5em;
      }
      .status-badge {
        font-size: 0.8em;
        padding: 0.4em 0.8em;
        border-radius: 20px;
      }
      .config-group {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
      }
    </style>
{% endblock %}
{% block content %}
    <div class="container-fluid py-4">
      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary" onclick="saveAllSettings()">
          <i class="fas fa-save"></i> 儲存所有設定
        </button>
      </div>

      <!-- 設定分頁 -->
      <div class="row">
        <div class="col-12">
          <ul class="nav nav-pills mb-4" id="settingsTabs">
            <li class="nav-item">
              <a
                class="nav-link active"
                data-bs-toggle="pill"
                href="#system-config"
              >
                <i class="fas fa-server"></i> 系統配置
              </a>
            </li>
            
            <!-- 方案管理分頁移除，請使用左側「方案管理」頁面 -->
          </ul>
        </div>
      </div>

      <!-- 設定內容 -->
      <div class="tab-content">
        <!-- 系統配置 -->
        <div class="tab-pane fade show active" id="system-config">
          <div class="row">
            <div class="col-md-6">
              <div class="settings-card">
                <div class="settings-header">
                  <h5 class="mb-0"><i class="fas fa-cog"></i> 基本系統設定</h5>
                </div>
                <div class="card-body">
                  

                  <div class="mb-3">
                    <label class="form-label">計算精度 (小數位數)</label>
                    <select id="calculation-precision" class="form-select">
                      <option value="0">整數</option>
                      <option value="1">1位小數</option>
                      <option value="2">2位小數</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              
            </div>
          </div>

          <!-- 系統狀態 -->
          <div class="row">
            <div class="col-12">
              <div class="settings-card">
                <div class="settings-header">
                  <h5 class="mb-0">
                    <i class="fas fa-heartbeat"></i> 系統狀態
                  </h5>
                </div>
                <div class="card-body">
                  <div class="row" id="system-status">
                    <!-- 動態載入系統狀態 -->
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        

        <!-- 方案管理分頁已移除，請使用左側「方案管理」頁面進行管理 -->
      </div>
    </div>
{% endblock %}
{% block scripts %}
    <script>
      // 全域變數
      let systemConfig = {};
      let availablePlans = [];

      // 初始化
      document.addEventListener("DOMContentLoaded", function () {
        loadSystemConfig();
        loadSystemStatus();
        loadPlanList();
        
      });

      // 載入系統配置
      async function loadSystemConfig() {
        try {
          const response = await fetch("/api/system/config");
          const data = await response.json();

          if (data.success) {
            systemConfig = data.config;
            populateConfigForm();
          }
        } catch (error) {
          console.error("載入系統配置失敗:", error);
        }
      }

      // 填充配置表單
      function populateConfigForm() {
        
        document.getElementById("calculation-precision").value =
          systemConfig.calculation_precision || 2;

        // 已移除啟用方案切換功能
        
      }

      // 載入系統狀態
      async function loadSystemStatus() {
        const statusContainer = document.getElementById("system-status");

        const statusItems = [
          { name: "傳統計算器", status: "success", icon: "calculator" },
          { name: "多維度計算器", status: "success", icon: "tags" },
          { name: "增強版計算器", status: "warning", icon: "rocket" },
          { name: "配置文件", status: "success", icon: "file-alt" },
        ];

        statusContainer.innerHTML = statusItems
          .map(
            (item) => `
          <div class="col-md-3 mb-3">
            <div class="text-center">
              <i class="fas fa-${item.icon} fa-2x text-${
              item.status === "success" ? "success" : "warning"
            } mb-2"></i>
              <h6>${item.name}</h6>
              <span class="status-badge bg-${
                item.status === "success" ? "success" : "warning"
              }">
                ${item.status === "success" ? "正常" : "檢查中"}
              </span>
            </div>
          </div>
        `
          )
          .join("");
      }

      // 載入方案列表（僅供顯示或其他用途，不含啟用）
      async function loadPlanList() {
        try {
          const response = await fetch("/api/plans");
          const data = await response.json();

          if (data.success) {
            availablePlans = data.plans;
            // 本頁僅顯示狀態，不操作啟用
          }
        } catch (error) {
          console.error("載入方案列表失敗:", error);
        }
      }

      // 檢查增強版引擎狀態
      

      // 儲存所有設定
      async function saveAllSettings() {
        const config = {
          system_mode: "multidimensional",
          default_calculation_engine: "multidimensional",
          calculation_precision: parseInt(
            document.getElementById("calculation-precision").value
          ),
          enable_manual_override: false,
          enable_enhanced_calculator: false,
        };

        try {
          const response = await fetch("/api/system/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(config),
          });

          const data = await response.json();

          if (data.success) {
            alert("設定已儲存成功！");
            systemConfig = { ...systemConfig, ...config };
          } else {
            alert("儲存設定失敗：" + data.error);
          }
        } catch (error) {
          alert("儲存設定時發生錯誤：" + error.message);
        }
      }

      // 已移除 activatePlan 與任何啟用相關函式
      function refreshPlanList() {
        loadPlanList();
      }
    </script>
{% endblock %}
